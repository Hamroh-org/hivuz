// Sort
TERMS.sort((a,b) => a.name.localeCompare(b.name, 'uz'));

// Build alphabet nav
const letters = [...new Set(TERMS.map(t=>t.letter))].sort();
const alphNav = document.getElementById('alphNav');
'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
  const btn = document.createElement('a');
  btn.className = 'alpha-btn' + (letters.includes(l) ? ' has-terms' : '');
  btn.textContent = l;
  if(letters.includes(l)) btn.href = '#letter-'+l;
  alphNav.appendChild(btn);
});

// Build terms list
const list = document.getElementById('termsList');
let currentLetter = '';

TERMS.forEach((term, i) => {
  if(term.letter !== currentLetter) {
    currentLetter = term.letter;
    const group = document.createElement('div');
    group.className = 'letter-group';
    group.id = 'letter-' + currentLetter;
    group.innerHTML = '<span class="letter-anchor">' + currentLetter + '</span><div class="terms-list" id="tl-'+currentLetter+'"></div>';
    list.appendChild(group);
  }
  const tl = document.getElementById('tl-' + term.letter);
  const el = document.createElement('div');
  el.className = 'term';
  el.dataset.name = (term.name + ' ' + (term.full_name||'')).toLowerCase();
  el.innerHTML = `
    <div class="term-head" onclick="togTerm(this)">
      <span class="term-name">${term.name}</span>
      <span class="term-short">${term.short}</span>
      <span class="term-icon">+</span>
    </div>
    <div class="term-body">
      ${term.full_name ? '<span class="tag-pill">'+term.full_name+'</span>' : ''}
      ${term.tag ? '<span class="tag-pill">'+term.tag+'</span>' : ''}
      <p class="term-full">${term.full}</p>
      ${term.link ? '<a href="'+term.link+'" class="term-link">→ '+term.link_text+'</a>' : ''}
    </div>
  `;
  tl.appendChild(el);
});

function togTerm(el){
  const term = el.parentElement;
  const isOpen = term.classList.contains('open');
  document.querySelectorAll('.term').forEach(t=>{t.classList.remove('open');t.querySelector('.term-icon').textContent='+';});
  if(!isOpen){term.classList.add('open');el.querySelector('.term-icon').textContent='+';}
}

function search(q){
  const v = q.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.term').forEach(t=>{
    const match = !v || t.dataset.name.includes(v);
    t.classList.toggle('hidden', !match);
    if(match) visible++;
  });
  document.querySelectorAll('.letter-group').forEach(g=>{
    const hasVisible = g.querySelectorAll('.term:not(.hidden)').length > 0;
    g.style.display = hasVisible ? '' : 'none';
  });
  document.getElementById('noResults').style.display = visible===0 ? 'block' : 'none';
}

// Emergency Quick Exit (ESC key & Button click)
(function() {
  function quickExit(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    window.location.replace('https://www.google.com');
  }
  var exitBtn = document.getElementById('quickExitBtn');
  if (exitBtn) {
    exitBtn.addEventListener('click', quickExit);
  }
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      quickExit(e);
    }
  });
})();
