<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[{"@type":"DefinedTermSet","@id":"https://hiv.hikmatillo.work/ru/glossariy.html#terms","name":"Словарь терминов о ВИЧ: CD4, АРВ, ПрЭП, Н=Н","url":"https://hiv.hikmatillo.work/ru/glossariy.html","inLanguage":"ru","hasDefinedTerm":[{"@type":"DefinedTerm","name":"АРВ-терапия","description":"Антиретровирусная терапия (АРВ-терапия) — комплекс препаратов, останавливающих размножение ВИЧ. Обычно принимается по 1 таблетке в день. АРВ-терапия не уничтожает ВИЧ полностью, но снижает количество вируса в крови до неопределяемого уровня (Н=Н). Это сохраняет иммунитет и позволяет человеку жить здоровой и долгой жизнью.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-1","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Н=Н (Неопределяемый = Непередающий)","description":"Неопределяемый = Непередающий (Н=Н). Когда на фоне регулярной АРВ-терапии вирусная нагрузка снижается до неопределяемого уровня (<200 копий/мл), ВИЧ в близких отношениях не передаётся другим. Это научный факт, подтверждённый ВОЗ и CDC. В более чем 135 000 случаев не зафиксировано ни одной передачи.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-2","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Неопределяемый уровень","description":"Если вирусная нагрузка в крови ниже 50 копий/мл, это называется «неопределяемым уровнем». Это говорит о высокой эффективности АРВ-терапии. При неопределяемом уровне вирус не передаётся другим в близких отношениях.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-3","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Клетки CD4","description":"CD4+ Т-лимфоциты — главные «стражи» иммунной системы. У здорового человека их 500–1500 кл/мм³. ВИЧ поражает именно эти клетки. Регулярная АРВ-терапия сохраняет клетки CD4 и полностью восстанавливает иммунитет.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-4","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"ИФА (ELISA)","description":"Иммуноферментный анализ (ИФА). Одновременно выявляет антитела к ВИЧ и антиген p24 (4-е поколение). Период окна: 18–45 дней. Точность: >99,5%. Стандартный лабораторный анализ.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-5","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Гепатит B","description":"Вирус гепатита B — вирус, поражающий ткани печени. Как и ВИЧ, передаётся через биологические жидкости организма и нестерильные инструменты. Некоторые АРВ-препараты помогают в обоих случаях. Существует вакцина от гепатита B.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-6","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Гепатит C","description":"Гепатит C передаётся преимущественно через нестерильные медицинские инструменты. Сегодня полностью излечивается курсом лечения продолжительностью 8–12 недель. Эффективно лечится и при сочетании с ВИЧ.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-7","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Средство защиты","description":"Средство защиты (барьерное средство) — до 98% эффективно предотвращает передачу ВИЧ и других инфекций в близких отношениях. При осторожности и правильном использовании позволяет полностью защитить здоровье.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-8","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Иммунная система","description":"Сложная система, защищающая организм от различных инфекций, вирусов и внешних факторов. Клетки CD4 — ведущее звено этой системы. АРВ-терапия сохраняет этот щит крепким.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-9","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Интеграза","description":"Интеграза — фермент, работающий в цепочке размножения ВИЧ. Современная группа АРВ-препаратов — ингибиторы интегразы — останавливает этот процесс и не даёт вирусу размножаться.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-10","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Отношение общества (стигма)","description":"Стигма — неуместный страх, возникающий из-за недостатка информации о ВИЧ. С медицинской точки зрения он необоснован. Человек, принимающий АРВ-терапию (Н=Н), абсолютно безопасен для общества и близких.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-11","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Капсид","description":"Капсид — внутренняя оболочка вируса, в которой хранится его генетический материал. Некоторые современные АРВ-препараты направлены именно на обезвреживание капсида.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-12","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Конфиденциальность","description":"Закон Республики Узбекистан (№813-I, статья 8): диагноз ВИЧ — строгая врачебная тайна. Врач или медицинский работник не вправе никому раскрывать эту информацию без вашего письменного разрешения. Нарушение конфиденциальности влечёт юридическую ответственность.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-13","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Закон №813-I","description":"Закон «О противодействии распространению заболевания, вызываемого вирусом иммунодефицита человека (ВИЧ-инфекции)». Статья 4: гарантирует бесплатную АРВ-терапию, медицинскую помощь и социальную защиту.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-14","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"ВИЧ","description":"Вирус иммунодефицита человека (ВИЧ). Поражает клетки CD4. Благодаря современной АРВ-терапии ВИЧ становится полностью контролируемым хроническим состоянием — человек живёт долгой и благополучной жизнью. ВИЧ — это не СПИД.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-15","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"СПИД","description":"Синдром приобретённого иммунодефицита (СПИД). Развивается только в случае, если ВИЧ многие годы остаётся без лечения. У людей, своевременно получающих АРВ-терапию, СПИД не развивается.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-16","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Оппортунистические состояния","description":"Инфекции, возникающие в период ослабления иммунитета. Благодаря регулярной АРВ-терапии и росту CD4 риск таких состояний полностью исчезает.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-17","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Период окна","description":"Период окна — время, необходимое для выработки в организме достаточного количества антител к вирусу. В зависимости от вида анализа: экспресс-тест (23–90 дней), ИФА (18–45 дней), ПЦР (10–33 дня).","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-18","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"ПЭП (экстренная профилактика)","description":"Экстренная профилактика (ПЭП) — короткий 28-дневный курс препаратов, который нужно начать в первые 72 часа после рискованной ситуации. Предоставляется в центрах по борьбе со СПИДом.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-19","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"ПрЭП (постоянная профилактика)","description":"Доконтактная профилактика (ПрЭП) — препарат, который принимают люди с отрицательным ВИЧ-статусом для защиты своего здоровья. При правильном приёме снижает риск до 99%.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-20","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Протеаза","description":"Протеаза — важный фермент на стадии размножения вируса. Ингибиторы протеазы блокируют этот фермент и обезвреживают его.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-21","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"ПЦР / NAT","description":"Анализ ПЦР — напрямую и с высокой точностью выявляет РНК ВИЧ. Период окна: 10–33 дня.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-22","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Устойчивость (резистентность)","description":"Если АРВ-препараты не принимать регулярно в назначенное время, вирус может привыкнуть к их действию. Поэтому строгая приверженность лечению — залог здоровья.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-23","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Обратная транскриптаза","description":"Обратная транскриптаза — фермент, работающий в цепочке размножения ВИЧ. АРВ-препараты блокируют этот процесс.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-24","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"РНК","description":"РНК — набор наследственной информации ВИЧ. Анализ ПЦР подсчитывает в крови именно копии этой РНК.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-25","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Туберкулёз","description":"Туберкулёз — состояние, на которое необходимо обращать внимание в отношении здоровья людей, живущих с ВИЧ. Рекомендуется ежегодный профилактический осмотр. Сегодня излечивается полностью.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-26","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Раскрытие статуса (disclosure)","description":"Рассказать близким о диагнозе ВИЧ — исключительно ваше личное желание. По закону никто не вправе вас к этому принуждать. Кому и когда рассказать — решаете вы сами.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-27","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Экспресс-тест","description":"Экспресс-тест — по капле крови из кончика пальца показывает предварительный результат за 15–20 минут. В центрах по борьбе со СПИДом проводится бесплатно и анонимно.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-28","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Вирусная нагрузка","description":"Вирусная нагрузка — число копий вируса в 1 мл крови. После начала АРВ-терапии в течение 3–6 месяцев вирусная нагрузка снижается до «неопределяемого уровня» (<50 копий/мл) (Н=Н).","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-29","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Иммуноблот (Western blot)","description":"Иммуноблот — заключительный подтверждающий этап анализа на ВИЧ. Специальный лабораторный стандарт.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-30","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"},{"@type":"DefinedTerm","name":"Инфекции, передающиеся через близость","description":"Инфекции, передающиеся через близость. Наличие таких инфекций может повышать вероятность передачи ВИЧ. Поэтому использование личных средств защиты — лучшая профилактика.","url":"https://hiv.hikmatillo.work/ru/glossariy.html#term-31","inDefinedTermSet":"https://hiv.hikmatillo.work/ru/glossariy.html"}]},{"@type":"BreadcrumbList","@id":"https://hiv.hikmatillo.work/ru/glossariy.html#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Главная","item":"https://hiv.hikmatillo.work/ru/"},{"@type":"ListItem","position":2,"name":"Словарь","item":"https://hiv.hikmatillo.work/ru/glossariy.html"}]}]}

// Sort

// Build alphabet nav
const letters = [...new Set(TERMS.map(t=>t.letter))].sort((a,b)=>a.localeCompare(b,'ru'));
const alphNav = document.getElementById('alphNav');
'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('').forEach(l => {
  const btn = document.createElement('a');
  btn.className = 'alpha-btn' + (letters.includes(l) ? ' has-terms' : '');
  btn.textContent = l;
  if(letters.includes(l)) btn.href = '#letter-'+l;
  alphNav.appendChild(btn);
});

// Build terms list
const list = document.getElementById('termsList');
let currentLetter = '';

TERMS.forEach((term, i) => {
  if(term.letter !== currentLetter) {
    currentLetter = term.letter;
    const group = document.createElement('div');
    group.className = 'letter-group';
    group.id = 'letter-' + currentLetter;
    group.innerHTML = '<span class="letter-anchor">' + currentLetter + '</span><div class="terms-list" id="tl-'+currentLetter+'"></div>';
    list.appendChild(group);
  }
  const tl = document.getElementById('tl-' + term.letter);
  const el = document.createElement('div');
  el.className = 'term';
  el.dataset.name = (term.name + ' ' + (term.full_name||'')).toLowerCase();
  el.innerHTML = `
    <div class="term-head" onclick="togTerm(this)">
      <span class="term-name">${term.name}</span>
      <span class="term-short">${term.short}</span>
      <span class="term-icon">+</span>
    </div>
    <div class="term-body">
      ${term.full_name ? '<span class="tag-pill">'+term.full_name+'</span>' : ''}
      ${term.tag ? '<span class="tag-pill">'+term.tag+'</span>' : ''}
      <p class="term-full">${term.full}</p>
      ${term.link ? '<a href="'+term.link+'" class="term-link">→ '+term.link_text+'</a>' : ''}
    </div>
  `;
  tl.appendChild(el);
});

function togTerm(el){
  const term = el.parentElement;
  const isOpen = term.classList.contains('open');
  document.querySelectorAll('.term').forEach(t=>{t.classList.remove('open');t.querySelector('.term-icon').textContent='+';});
  if(!isOpen){term.classList.add('open');el.querySelector('.term-icon').textContent='+';}
}

function search(q){
  const v = q.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.term').forEach(t=>{
    const match = !v || t.dataset.name.includes(v);
    t.classList.toggle('hidden', !match);
    if(match) visible++;
  });
  document.querySelectorAll('.letter-group').forEach(g=>{
    const hasVisible = g.querySelectorAll('.term:not(.hidden)').length > 0;
    g.style.display = hasVisible ? '' : 'none';
  });
  document.getElementById('noResults').style.display = visible===0 ? 'block' : 'none';
}

// Emergency Quick Exit (ESC key & Button click)
(function() {
  function quickExit(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    window.location.replace('https://www.google.com');
  }
  var exitBtn = document.getElementById('quickExitBtn');
  if (exitBtn) {
    exitBtn.addEventListener('click', quickExit);
  }
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      quickExit(e);
    }
  });
})();
